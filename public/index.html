<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RowanAI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      doc,
      setDoc,
      deleteDoc,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    // ── Firebase config ──────────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyC5GiTIyE6Zo7-zR0GRoJcdcs0wED0T1TY",
      authDomain: "gemini-wrapper-52e4b.firebaseapp.com",
      projectId: "gemini-wrapper-52e4b",
      storageBucket: "gemini-wrapper-52e4b.firebasestorage.app",
      messagingSenderId: "732602506033",
      appId: "1:732602506033:web:0ae353887d2290e2502e10",
      measurementId: "G-G8SP2Q0K43"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getFirestore(app);

    const provider = new GoogleAuthProvider();

    // Call our Vercel serverless API
    async function callChatApi(sessionId, message) {
      console.log("[chat] getting id token...");
      const idToken = await auth.currentUser.getIdToken();
      console.log("[chat] sending request to /api/chat");
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${idToken}`,
        },
        body: JSON.stringify({ sessionId, message }),
      });
      console.log("[chat] response status:", res.status);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        console.error("[chat] error response:", err);
        throw new Error(err.error || `Request failed (${res.status})`);
      }
      const data = await res.json();
      console.log("[chat] reply received:", data);
      return data;
    }

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const loginScreen   = document.getElementById("login-screen");
    const appScreen     = document.getElementById("app-screen");
    const loginBtn      = document.getElementById("login-btn");
    const logoutBtn     = document.getElementById("logout-btn");
    const userAvatar    = document.getElementById("user-avatar");
    const userName      = document.getElementById("user-name");
    const messagesEl    = document.getElementById("messages");
    const inputEl       = document.getElementById("message-input");
    const sendBtn       = document.getElementById("send-btn");
    const newChatBtn    = document.getElementById("new-chat-btn");
    const sessionsList  = document.getElementById("sessions-list");
    const typingEl      = document.getElementById("typing-indicator");

    let currentUser     = null;
    let currentSessionId = null;
    let unsubscribeMessages = null;

    // ── Auth ─────────────────────────────────────────────────────────────────
    loginBtn.addEventListener("click", () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        loginScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");
        userAvatar.src = user.photoURL || "";
        userName.textContent = user.displayName || user.email;
        await loadSessions();
      } else {
        currentUser = null;
        loginScreen.classList.remove("hidden");
        appScreen.classList.add("hidden");
        if (unsubscribeMessages) unsubscribeMessages();
      }
    });

    // ── Sessions ─────────────────────────────────────────────────────────────
    async function loadSessions() {
      const sessionsRef = collection(db, "users", currentUser.uid, "sessions");
      const q = query(sessionsRef, orderBy("updatedAt", "desc"));
      onSnapshot(q, snapshot => {
        sessionsList.innerHTML = "";
        if (snapshot.empty) {
          createNewSession();
          return;
        }
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const item = document.createElement("div");
          item.className = "session-item" + (docSnap.id === currentSessionId ? " active" : "");
          item.dataset.id = docSnap.id;

          const title = document.createElement("span");
          title.className = "session-title";
          title.textContent = data.title || "New chat";

          const del = document.createElement("button");
          del.className = "session-delete";
          del.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
          del.addEventListener("click", e => { e.stopPropagation(); deleteSession(docSnap.id); });

          item.appendChild(title);
          item.appendChild(del);
          item.addEventListener("click", () => openSession(docSnap.id, data.title));
          sessionsList.appendChild(item);
        });

        // Auto-open most recent session if none selected
        if (!currentSessionId && !snapshot.empty) {
          const first = snapshot.docs[0];
          openSession(first.id, first.data().title);
        }
      });
    }

    async function createNewSession() {
      const sessionsRef = collection(db, "users", currentUser.uid, "sessions");
      const newDoc = await addDoc(sessionsRef, {
        title: "New chat",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      openSession(newDoc.id, "New chat");
    }

    async function deleteSession(sessionId) {
      const messagesRef = collection(db, "users", currentUser.uid, "sessions", sessionId, "messages");
      const snap = await getDocs(messagesRef);
      const deletes = snap.docs.map(d => deleteDoc(d.ref));
      await Promise.all(deletes);
      await deleteDoc(doc(db, "users", currentUser.uid, "sessions", sessionId));
      if (currentSessionId === sessionId) {
        currentSessionId = null;
        messagesEl.innerHTML = "";
        if (unsubscribeMessages) unsubscribeMessages();
      }
    }

    function openSession(sessionId, title) {
      currentSessionId = sessionId;
      document.querySelectorAll(".session-item").forEach(el => {
        el.classList.toggle("active", el.dataset.id === sessionId);
      });
      if (unsubscribeMessages) unsubscribeMessages();
      loadMessages(sessionId);
    }

    // ── Messages ──────────────────────────────────────────────────────────────
    function loadMessages(sessionId) {
      messagesEl.innerHTML = "";
      const msgsRef = collection(db, "users", currentUser.uid, "sessions", sessionId, "messages");
      const q = query(msgsRef, orderBy("createdAt", "asc"));
      unsubscribeMessages = onSnapshot(q, snapshot => {
        // Re-render all messages cleanly (handles first load + realtime)
        messagesEl.innerHTML = "";
        snapshot.forEach(docSnap => {
          renderMessage(docSnap.data());
        });
        scrollToBottom();
      });
    }

    function renderMessage({ role, text }) {
      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = formatText(text);

      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
    }

    // Markdown + LaTeX rendering
    marked.setOptions({ breaks: true, gfm: true });

    function formatText(text) {
      // Protect LaTeX blocks from being mangled by marked
      const mathBlocks = [];
      let protected_text = text
        // Display math $$...$$ 
        .replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {
          mathBlocks.push({ type: "display", math });
          return `MATHBLOCK${mathBlocks.length - 1}END`;
        })
        // Inline math $...$
        .replace(/\$([^\$\n]+?)\$/g, (_, math) => {
          mathBlocks.push({ type: "inline", math });
          return `MATHBLOCK${mathBlocks.length - 1}END`;
        });

      // Run through marked for markdown
      let html = marked.parse(protected_text);

      // Restore math blocks
      html = html.replace(/MATHBLOCK(\d+)END/g, (_, i) => {
        const { type, math } = mathBlocks[parseInt(i)];
        try {
          return katex.renderToString(math, {
            displayMode: type === "display",
            throwOnError: false,
          });
        } catch {
          return math;
        }
      });

      return html;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Send ──────────────────────────────────────────────────────────────────
    async function sendMessage() {
      const text = inputEl.value.trim();
      console.log("[send] clicked, text:", text, "sessionId:", currentSessionId);
      if (!text || !currentSessionId) {
        console.warn("[send] aborting — missing text or sessionId");
        return;
      }

      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;

      // Save user message to Firestore
      const msgsRef = collection(db, "users", currentUser.uid, "sessions", currentSessionId, "messages");
      await addDoc(msgsRef, {
        role: "user",
        text,
        createdAt: serverTimestamp()
      });

      // Update session title on first message
      const sessionRef = doc(db, "users", currentUser.uid, "sessions", currentSessionId);
      const shortTitle = text.length > 40 ? text.slice(0, 40) + "…" : text;
      await setDoc(sessionRef, { title: shortTitle, updatedAt: serverTimestamp() }, { merge: true });

      // Show typing indicator
      typingEl.classList.remove("hidden");
      scrollToBottom();

      try {
        const result = await callChatApi(currentSessionId, text);
        const reply = result.reply;

        await addDoc(msgsRef, {
          role: "model",
          text: reply,
          createdAt: serverTimestamp()
        });
        await setDoc(sessionRef, { updatedAt: serverTimestamp() }, { merge: true });
      } catch (err) {
        await addDoc(msgsRef, {
          role: "model",
          text: "⚠️ Error: " + (err.message || "Something went wrong."),
          createdAt: serverTimestamp()
        });
      } finally {
        typingEl.classList.add("hidden");
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    newChatBtn.addEventListener("click", createNewSession);

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });
  </script>
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><circle cx="19" cy="5" r="3" fill="currentColor" stroke="none"/></svg>
      </div>
      <h1>RowanAI</h1>
      <p>Sign in to start chatting</p>
      <button id="login-btn" class="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- App screen -->
  <div id="app-screen" class="hidden">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">RowanAI</span>
        <button id="new-chat-btn" class="icon-btn" title="New chat">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div id="sessions-list"></div>
      <div class="sidebar-footer">
        <img id="user-avatar" src="" alt="avatar" />
        <span id="user-name"></span>
        <button id="logout-btn" class="icon-btn" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main chat area -->
    <main id="chat-area">
      <div id="messages"></div>

      <div id="typing-indicator" class="hidden">
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div id="input-bar">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Message RowanAI…"
          autocomplete="off"
        ></textarea>
        <button id="send-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </main>

  </div>

</body>
</html>
